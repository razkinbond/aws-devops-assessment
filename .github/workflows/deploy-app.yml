name: Deploy Application

on:
  workflow_run:
    workflows: ["Deploy Infrastructure"]
    types:
      - completed
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
  workflow_dispatch: # Allows manual trigger if needed

jobs:
  deploy-app:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Build & Deploy Containers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --- FRONTEND BUILD & DEPLOY ---
      - name: Build & Push Frontend Image
        run: |
          docker build -t dev-frontend ./frontend
          docker tag dev-frontend:latest ${{ steps.login-ecr.outputs.registry }}/dev-frontend:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/dev-frontend:latest

      - name: Update ECS Frontend Service
        run: |
          aws ecs update-service \
            --cluster dev-ecs-cluster \
            --service dev-frontend-service \
            --force-new-deployment \
            --region ap-south-2

      # --- BACKEND BUILD & DEPLOY ---
      - name: Build & Push Backend Image
        run: |
          docker build -t dev-backend ./backend
          docker tag dev-backend:latest ${{ steps.login-ecr.outputs.registry }}/dev-backend:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/dev-backend:latest

      - name: Update ECS Backend Service
        run: |
          aws ecs update-service \
            --cluster dev-ecs-cluster \
            --service dev-backend-service \
            --force-new-deployment \
            --region ap-south-2